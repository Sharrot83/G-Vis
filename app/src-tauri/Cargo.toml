[package]
name = "g-vis"
version = "1.0.0"
description = "G-vis: G-code visualizer, lexicon and CNC simulators"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

# Microsoft Store: köpta tillägg och köp
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Services_Store", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
