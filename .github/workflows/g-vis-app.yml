# Bygger G-vis som program (Windows, Mac och Linux) när en release publiceras.
# Installationsfilerna läggs automatiskt på releasen. Inget behöver installeras på din egen dator.
name: G-vis program

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux-paket som Tauri behöver
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Versionsnummer från releasen
        if: github.event_name == 'release'
        shell: bash
        run: |
          # versionen tas ur taggen, till exempel v1.0.8 -> 1.0.8 (tre tal med punkt emellan krävs)
          V=$(echo "$GITHUB_REF_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$V" ]; then echo "::error::Taggen '$GITHUB_REF_NAME' har inget versionsnummer. Använd till exempel v1.0.8."; exit 1; fi
          echo "Version: $V"
          node -e "const f='app/src-tauri/tauri.conf.json';const j=JSON.parse(require('fs').readFileSync(f));j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$V"

      - name: Programmets filer (samma som på webben)
        shell: bash
        run: node app/build.mjs

      - name: Ikoner
        shell: bash
        run: npx --yes @tauri-apps/cli@2 icon app/icon.png --output app/src-tauri/icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

      # Microsoft Store: ett MSIX-paket som laddas upp i Partner Center. Store signerar det, så Windows varnar inte.
      - name: Paket för Microsoft Store (MSIX)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./app/msix/bygg-msix.ps1

      - name: Lägg MSIX-paketet på releasen
        if: matrix.platform == 'windows-latest' && github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" app/msix/out/*.msix --clobber

      - name: Spara MSIX-paketet (vid manuell körning)
        if: matrix.platform == 'windows-latest' && github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: G-vis-msix
          path: app/msix/out/*.msix
